[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "zomatree/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]

[dist.dependencies.apt]
"libgtk-3-dev" = "*"
"libsoup-3.0-0" = "*"
"libsoup-3.0-dev" = "*"
"libjavascriptcoregtk-4.1-dev" = "*"
"libwebkit2gtk-4.1-dev" = "*"
"libglib2.0-dev" = "*"
"build-essential" = "*"
"libclang-dev" = "*"
"libc6-dev" = "*"
"pkg-config" = "*"
"libjpeg-turbo8-dev" = "*"

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
x86_64-unknown-linux-gnu = "ubuntu-26.04"
aarch64-unknown-linux-gnu = "ubuntu-26.04-arm"
