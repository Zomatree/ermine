[package]
name = "Ermine"
version = "0.7.2"
edition = "2024"
repository = "https://github.com/Zomatree/ermine"
homepage = "https://github.com/Zomatree/ermine"
description = "Native desktop client for Stoat chat"
authors = ["Zomatree <me@zomatree.live>"]

[package.metadata.wix]
upgrade-guid = "9EDC97C3-7713-477A-AB6E-C7D5B27E38E4"
path-guid = "3CD796B6-9391-47E7-AE68-D02FE1C5BE7E"
license = false
eula = false

[features]
hotreload = ["freya/hotreload"]
performance = ["freya-metrics-plugin"]
devtools = ["freya/devtools", "freya-devtools"]

[patch.crates-io]
serde_qs = { git = "https://github.com/Zomatree/serde_qs.git", rev = "b7497ee180401babefdf4701f5074710edc1a27b" }

[dependencies]
freya = { version = "0.5.0-rc.8", features = [
    "radio",
    "remote-asset",
    "markdown",
    "zoom-shortcuts",
] }
freya-engine = { version = "0.5.0-rc.8" }
freya-core = { version = "0.5.0-rc.8" }
freya-components = { version = "0.5.0-rc.8", features = [
    "remote-asset",
    "gif",
] }
freya-devtools = { version = "0.5.0-rc.8", optional = true }
freya-metrics-plugin = { version = "0.5.0-rc.8", optional = true }
# freya = { git = "https://github.com/marc2332/freya.git", features = [
#     "radio",
#     "remote-asset",
#     "markdown",
#     "zoom-shortcuts"
# ] }
# freya-engine = { git = "https://github.com/marc2332/freya.git" }
# freya-core = { git = "https://github.com/marc2332/freya.git" }
# freya-components = { git = "https://github.com/marc2332/freya.git", features = ["remote-asset", "gif"] }
# freya-devtools = { git = "https://github.com/marc2332/freya.git", optional = true }
# freya-metrics-plugin =  { git = "https://github.com/marc2332/freya.git", optional = true }

# freya = { path = "../freya/crates/freya", features = [
#     "radio",
#     "remote-asset",
#     "webview",
#     "markdown",
#     "zoom-shortcuts"
# ] }
# freya-engine = { path = "../freya/crates/freya-engine" }
# freya-core = { path = "../freya/crates/freya-core" }
# freya-components = { path = "../freya/crates/freya-components", features = ["remote-asset", "gif"] }
# freya-devtools = { path = "../freya/crates/freya-devtools", optional = true }

tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tungstenite = { version = "0.30.0", features = ["native-tls"] }
reqwest = { version = "0.13.5", features = [
    "json",
    "multipart",
    "stream",
    "form",
    "blocking",
] }
serde = "1.0"
serde_json = "1.0"
futures = "0.3"
log = "0.4"
pretty_env_logger = "0.5.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }
bytes = "1.12.1"
scc = "3.8.8"
indexmap = { version = "2.14.2", features = ["serde"] }
rfd = { version = "0.17.2", features = [] }
ulid = "1.2.1"
rand = "0.10.3"
infer = "0.22.0"
etcetera = "0.11.0"
euclid = "0.22.14"
jiff = { version = "0.2.37", features = ["serde"] }
regex = "1.13.1"
chumsky = { version = "0.13.0", features = [] }
material-colors = { git = "https://github.com/Aiving/material-colors", rev = "3fe7f52" }
open = "5.4.4"
livekit = { version = "0.9.3", features = ["native-tls"] }
async-trait = "0.1.92"
rustc-hash = "2.1.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
arboard = "3.6.1"
iso8601-timestamp = "0.2.0"
serde_qs = "1.1.3"
itertools = "0.15.0"
mimetype-detector = "0.3.12"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
two-face = { version = "0.5.2", features = ["syntect-default-fancy"] }
thumbhash = "0.1.0"
yuv = { version = "0.8.19", features = ["fast_mode"] }

stoat-models = { package = "revolt-models", version = "0.15.1", default-features = false, features = [
    "serde",
    "partials",
] }
stoat-permissions = { package = "revolt-permissions", version = "0.15.1" }
stoat-result = { package = "revolt-result", default-features = false, features = [
    "serde",
], version = "0.15.1" }
stoat-config = { package = "revolt-config", default-features = false, version = "0.15.1" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
