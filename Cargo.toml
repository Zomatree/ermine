[package]
name = "Ermine"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/Zomatree/ermine"
description = "Native desktop client for Stoat chat"

[features]
hotreload = ["freya/hotreload"]
performance = ["freya-performance-plugin"]
devtools = ["freya/devtools", "freya-devtools"]

[patch.crates-io]
serde_qs = { git = "https://github.com/Zomatree/serde_qs.git", rev = "b7497ee180401babefdf4701f5074710edc1a27b" }

[dependencies]
freya = { version = "0.5.0-rc.4", features = [
    "radio",
    "remote-asset",
    "webview",
    "markdown",
    "zoom-shortcuts"
] }
freya-core = { version = "0.5.0-rc.4" }
freya-components = { version = "0.5.0-rc.4", features = ["remote-asset", "gif"] }
freya-devtools = { version = "0.5.0-rc.4", optional = true }
freya-performance-plugin = { version = "0.5.0-rc.4", optional = true }

tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
tungstenite = { version = "0.27", features = ["native-tls"] }
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream", "form", "blocking"] }
serde = "1.0"
serde_json = "1.0"
futures = "0.3"
log = "0.4"
pretty_env_logger = "0.5.0"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread"] }
bytes = "1.11.0"
scc = "3.4.8"
indexmap = { version = "2.14.0", features = ["serde"] }
rfd = { version = "0.17.2", features = [] }
ulid = "1.2.1"
rand = "0.10.1"
infer = "0.19.0"
etcetera = "0.11.0"
euclid = "0.22.14"
jiff = { version = "0.2.32", features = ["serde"] }
regex = "1.12.3"
chumsky = { version = "0.13.0", features = [] }
material-colors = { git = "https://github.com/Aiving/material-colors", rev = "3fe7f52" }
open = "5.4.0"
# livekit = { version = "0.8.4", features = ["native-tls"] }
async-trait = "0.1.89"
rustc-hash = "2.1.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
arboard = "3.6.1"
iso8601-timestamp = "0.2.0"
serde_qs = "1.1.3"
itertools = "0.15.0"
mimetype-detector = "0.3.11"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"]}
two-face = { version = "0.5.2", features = ["syntect-default-fancy"] }

stoat-models = { package = "revolt-models", version = "0.15.1", default-features = false, features = [
    "serde",
    "partials",
] }
stoat-permissions = { package = "revolt-permissions", version = "0.15.1" }
stoat-result = { package = "revolt-result", default-features = false, features = [
    "serde",
], version = "0.15.1" }
stoat-config = { package = "revolt-config", default-features = false, version = "0.15.1" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
