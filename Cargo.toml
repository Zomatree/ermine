[package]
name = "Ermine"
version = "0.5.0"
edition = "2024"
repository = "https://github.com/Zomatree/ermine"
description = "Native desktop client for Stoat chat"

[features]
hotreload = ["freya/hotreload"]
devtools = ["freya/devtools", "freya-devtools"]

[dependencies]
freya = { version = "0.4.0", features = [
    "radio",
    "remote-asset",
    "webview",
    "markdown",
    "zoom-shortcuts",
] }
freya-core = { version = "0.4.0" }
freya-components = { version = "0.4.0", features = ["remote-asset", "gif"] }
freya-devtools = { version = "0.4.0", optional = true }

tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
tungstenite = { version = "0.27", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = "1.0"
serde_json = "1.0"
futures = "0.3"
log = "0.4"
pretty_env_logger = "0.5.0"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread"] }
bytes = "1.11.0"
scc = "3.4.8"
indexmap = { version = "2.14.0", features = ["serde"] }
rfd = { version = "0.17.2", features = [] }
ulid = "1.2.1"
rand = "0.10.1"
infer = "0.19.0"
etcetera = "0.11.0"
euclid = "0.22.14"
jiff = "0.2.32"
regex = "1.12.3"
chumsky = { version = "0.13.0", features = [] }
material-colors = { git = "https://github.com/Aiving/material-colors", rev = "3fe7f52" }
open = "5.4.0"
# liveki5.4.0 = { version = "0.7.49", features = ["native-tls"] }
async-trait = "0.1.89"
rustc-hash = "2.1.3"
pulldown-cmark = { version = "0.13.4", default-features = false }

stoat-models = { package = "revolt-models", version = "0.14.0", default-features = false, features = [
    "serde",
    "partials",
] }
stoat-permissions = { package = "revolt-permissions", version = "0.14.0" }
stoat-result = { package = "revolt-result", default-features = false, features = [
    "serde",
], version = "0.14.0" }
stoat-config = { package = "revolt-config", default-features = false, version = "0.14.0" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
